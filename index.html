<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prediction Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: url('https://source.unsplash.com/1600x900/?technology,business') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        }
        .title-box {
            text-align: center;
            padding: 10px;
            background: #007bff;
            color: white;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }
        .title-box:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Churn Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="title-box">Customer Churn Prediction</div>
        <form id="churnForm" class="row g-3 mt-3">
            <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Senior Citizen (0/1)</label>
                <input type="number" class="form-control" name="SeniorCitizen" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Partner</label>
                <select class="form-select" name="Partner">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Dependents</label>
                <select class="form-select" name="Dependents">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Tenure (Months)</label>
                <input type="number" class="form-control" name="tenure" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Monthly Charges</label>
                <input type="number" class="form-control" name="MonthlyCharges" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Total Charges</label>
                <input type="number" class="form-control" name="TotalCharges" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Internet Service</label>
                <select class="form-select" name="InternetService">
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Contract Type</label>
                <select class="form-select" name="Contract">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Paperless Billing</label>
                <select class="form-select" name="PaperlessBilling">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment Method</label>
                <select class="form-select" name="PaymentMethod">
                    <option value="Electronic check">Electronic check</option>
                    <option value="Mailed check">Mailed check</option>
                    <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                    <option value="Credit card (automatic)">Credit card (automatic)</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Service</label>
                <select class="form-select" name="PhoneService">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Multiple Lines</label>
                <select class="form-select" name="MultipleLines">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Online Security</label>
                <select class="form-select" name="OnlineSecurity">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Online Backup</label>
                <select class="form-select" name="OnlineBackup">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Device Protection</label>
                <select class="form-select" name="DeviceProtection">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Tech Support</label>
                <select class="form-select" name="TechSupport">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Streaming TV</label>
                <select class="form-select" name="StreamingTV">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Streaming Movies</label>
                <select class="form-select" name="StreamingMovies">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-12">
                <button type="submit" class="btn btn-success w-100">Predict</button>
            </div>
        </form>
        
        <div id="result" class="mt-3 alert d-none">
            <b>{{ output1 }}</b><br>
            <b>{{ output2 }}</b>
        </div>
        
    </div>
    
    <script>
        document.getElementById("churnForm").addEventListener("submit", function(event) {
            event.preventDefault();
        
            let formData = new FormData(event.target);
            let jsonData = {};
        
            formData.forEach((value, key) => {
                // Convert numbers to integer or float
                if (!isNaN(value) && value.trim() !== "") {
                    jsonData[key] = parseFloat(value);
                } else {
                    jsonData[key] = value;
                }
            });
        
            fetch("http://localhost:5000/predict", { 
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(jsonData)
            })
            .then(response => response.json())
            .then(data => {
                let resultDiv = document.getElementById("result");
                resultDiv.innerHTML = `<strong>Prediction:</strong> ${data.output1} <br> <strong>Confidence:</strong> ${data.output2}`;
                resultDiv.className = `mt-3 alert ${data.output1.includes('Churn') ? 'alert-danger' : 'alert-success'}`;
                resultDiv.classList.remove("d-none");
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Failed to get prediction. Check console for details.");
            });
        });
        </script>        
</body>
</html>
